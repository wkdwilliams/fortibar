[package]
name = "fortibar"
version = "0.1.0"
edition = "2021"

[dependencies]
tao = "0.34"
wry = "0.53"
tray-icon = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-manifest = "1.4"

[profile.release]
strip = true
lto = true
