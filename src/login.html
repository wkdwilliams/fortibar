<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --bg:#f7f8fb; --fg:#2c3e50; --label:#5b7083; --border:#b9c2cc; --accent:#1d8fe8; --btn:#0a78c2; --err:#c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1e2227; --fg:#e6e9ee; --label:#9fb0c2; --border:#475260; --accent:#2f9bff; --btn:#1a7fd0; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:22px 30px; background:var(--bg); color:var(--fg); font:14px -apple-system, BlinkMacSystemFont, sans-serif; user-select:none; }
  h1 { font-weight:400; font-size:22px; text-align:center; margin:0 0 18px; color:var(--label); }
  .row { display:grid; grid-template-columns:100px 1fr; align-items:center; gap:12px; margin-bottom:12px; }
  label.l { color:var(--label); }
  input[type=text], input[type=password] { width:100%; padding:7px 9px; border:1px solid var(--border); border-radius:4px; background:transparent; color:var(--fg); font-size:14px; user-select:text; }
  input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  .hint { color:var(--label); font-size:12px; }
  .err { color:var(--err); min-height:18px; text-align:center; margin:4px 0 8px; }
  .buttons { display:flex; justify-content:center; gap:16px; }
  button { width:130px; padding:9px; border:0; border-radius:4px; background:var(--btn); color:#fff; font-size:15px; cursor:pointer; }
  button:active { filter:brightness(.9); }
</style>
</head>
<body>
<h1 id="title">Connect</h1>
<form id="f" autocomplete="off">
  <div class="row"><label class="l" for="username">Username</label><input type="text" id="username" required></div>
  <div class="row"><label class="l" for="password">Password</label><input type="password" id="password" required></div>
  <div class="row"><span></span><div class="hint" id="hint"></div></div>
  <div class="err" id="err"></div>
  <div class="buttons"><button type="button" id="cancel">Cancel</button><button type="submit">Connect</button></div>
</form>
<script>
  const $ = id => document.getElementById(id);
  const send = msg => window.ipc.postMessage(JSON.stringify(msg));
  const l = window.__LOGIN;
  $('title').textContent = 'Connect to ' + l.name;
  $('username').value = l.username;
  $('err').textContent = l.error;
  $('hint').textContent = l.save
    ? 'The password is saved after a successful connect.'
    : 'The password isn’t saved; you’ll be asked each time.';
  $('cancel').onclick = () => send({ action: 'cancel' });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') send({ action: 'cancel' }); });
  $('f').onsubmit = e => {
    e.preventDefault();
    send({ action: 'connect', username: $('username').value.trim(), password: $('password').value });
  };
  window.showError = msg => { $('err').textContent = msg; };
  (l.username ? $('password') : $('username')).focus();
</script>
</body>
</html>
