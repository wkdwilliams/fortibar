name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-openconnect unzip

      - uses: actions/cache@v4
        with:
          path: |
            .cargo/registry
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build and package
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Msys2 "${{ steps.msys2.outputs.msys2-location }}"

      - uses: actions/upload-artifact@v4
        with:
          name: FortiBar-windows-x64
          path: dist/FortiBar-windows-x64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FortiBar-windows-x64.zip
